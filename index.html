* { box-sizing: border-box; }

.corner.bl { bottom: 10px; left: 10px; border-bottom-width: 1px; border-left-width: 1px; }

/* ================= scene engine ================= */
function createScene(canvas, sectors) {
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0;
  function resize() {
    const d = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * d; canvas.height = H * d;
    ctx.setTransform(d, 0, 0, d, 0, 0);

  resize(); window.addEventListener('resize', resize);

  const rgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  const cols = sectors.map(s => rgb(s.hue));
  const HUB = [150, 175, 210];
  const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
  const R = (a, b) => a + Math.random() * (b - a);

function Cursor({ color, hot }) {
  const ring = useRef(null), dot = useRef(null);
  useEffect(() => {
    if (!FINE || RM) return;
    let tx = 0, ty = 0, rx = 0, ry = 0, raf;
    const move = e => { tx = e.clientX; ty = e.clientY; ring.current.classList.add('on'); dot.current.classList.add('on'); dot.current.style.transform = `translate(${tx}px,${ty}px)`; };
    const leave = () => { ring.current.classList.remove('on'); dot.current.classList.remove('on'); };
    const loop = () => { rx += (tx - rx) * .2; ry += (ty - ry) * .2; ring.current.style.transform = `translate(${rx}px,${ry}px) rotate(${hot ? 45 : 0}deg)`; raf = requestAnimationFrame(loop); };
    window.addEventListener('pointermove', move, { passive: true });
    document.documentElement.addEventListener('pointerleave', leave);
    raf = requestAnimationFrame(loop);
    return () => { window.removeEventListener('pointermove', move); document.documentElement.removeEventListener('pointerleave', leave); cancelAnimationFrame(raf); };
  }, [hot]);
  return html`<${Fragment}>
    <div className=${'ring' + (hot ? ' hot' : '')} ref=${ring} style=${{ '--cur': color }} aria-hidden="true"></div>
    <div className="cdot" ref=${dot} style=${{ '--cur': color }} aria-hidden="true"></div>
  <//>`;
}

function Title() {

  return html`<h1 className="title" aria-label="Siddharth Kannan">${line('Siddharth', 'l1')}${line('Kannan', 'l2')}</h1>`;
}

      <dt>Languages</dt><dd>English (professional), Tamil (native)</dd>
    </dl>
    <h3>B.E. Mechatronics</h3>
    <p className="muted" style=${{ marginTop: '4px' }}>Bannari Amman Institute of Technology, Tamil Nadu · 2018 – 2022 · First Class. Final-year project: a door that unlocks with facial recognition, built on image processing.</p>
  <//>`;
}

function Experience() {
  return html`<div className="jobs">
    ${JOBS.map(j => html`<article key=${j.id} className=${'job' + (j.current ? ' current' : '')}>
      <div className="when">${j.when}${j.current ? ' · current' : ''}</div>
      <h3>${j.title}</h3>
      <div className="org">${j.org}${j.ctx ? ' · ' + j.ctx : ''}</div>
      <ul>${j.points.map((p, i) => html`<li key=${i}>${p}</li>`)}</ul>
      ${j.promo ? html`<p className="promo">${j.promo}</p>` : null}
    </article>`)}
  </div>`;
}

function Skills() {
  return html`<div className="skillset">
    ${SKILLS.map(s => html`<div key=${s.name}>
      <h3>${s.name}</h3>
      <div className="chips">
        ${s.items.map(i => html`<span className="chip" key=${i}>${i}</span>`)}
        ${(s.learning || []).map(i => html`<span className="chip learning" key=${i}>${i} · learning</span>`)}
      </div>

}

function Project() {
  return html`<${Fragment}>
    <p className="lead">A Spring Boot service that keeps a running record of my GitHub commits in PostgreSQL.</p>
    <ol className="flow">
      <li>Call the GitHub API with a plain Java HTTP client.</li>
      <li>Map events to JPA entities.</li>
      <li>Skip any event already stored.</li>
      <li>Save to PostgreSQL and repeat every hour.</li>
    </ol>
    <p className="p-eyebrow" style=${{ marginTop: '22px' }}>Data model</p>
    <div className="schema"><span className="entity">User</span><span className="rel">1 → n</span><span className="entity">Repository</span><span className="rel">n ↔ n</span><span className="entity">CommitRecords</span></div>
    <ul className="feat">
      <li><b>Hourly sync</b>Scheduled with <code>@Scheduled</code>; duplicates skipped via <code>existsByEventID()</code>.</li>
      <li><b>Normalised schema</b>One-to-many and many-to-many JPA mappings across three entities.</li>
      <li><b>Clean errors</b>Custom <code>GitHubAPIException</code>, an <code>ErrorResponse</code> DTO and <code>@RestControllerAdvice</code>.</li>

    <div className="chips">${['Spring Boot', 'PostgreSQL', 'Spring Data JPA', 'Hibernate', 'REST', 'Scheduler'].map(t => html`<span className="chip" key=${t}>${t}</span>`)}</div>

function Contact() {
  const [msg, setMsg] = useState('');
  const out = useRef(null);
  const copy = () => {
    const sel = () => { const r = document.createRange(); r.selectNodeContents(out.current); const s = getSelection(); s.removeAllRanges(); s.addRange(r); setMsg('Selected. Press Ctrl+C to copy.'); };
    try { navigator.clipboard.writeText(out.current.textContent).then(() => setMsg('Copied to clipboard'), sel); } catch (e) { sel(); }
  };
  return html`<${Fragment}>
    <p className="lead">I'm interested in Java backend and integration work, especially in banking and fintech. Email is the best way to reach me.</p>
    <div className="email">
      <output ref=${out}>sid7152@outlook.com</output>
      <button className="btn" type="button" onClick=${copy}>Copy email</button>
    </div>
    <div className="copied" role="status">${msg}</div>
    <div className="chips" style=${{ marginTop: '18px' }}>${['Java backend', 'Spring Boot', 'Enterprise integration', 'Banking & fintech'].map(t => html`<span className="chip" key=${t}>${t}</span>`)}</div>
  <//>`;
}

const BODIES = { about: About, experience: Experience, skills: Skills, project: Project, contact: Contact };
const TITLES = { about: 'Backend work where correctness matters', experience: 'Five roles, one thread: banking', skills: 'The toolkit', project: 'GitHub Activity Logger', contact: "Let's talk" };

/* ================= app ================= */
function App() {
  const canvas = useRef(null), eng = useRef(null), optRefs = useRef([]), busy = useRef(false);
  const initial = SECTORS.findIndex(s => s.id === (location.hash || '').slice(1));
  const [screen, setScreen] = useState(initial >= 0 ? 'section' : 'welcome');
  const [from, setFrom] = useState(null);
  const [focus, setFocus] = useState(initial >= 0 ? initial : 0);
  const [hover, setHover] = useState(-1);
  const [delay, setDelay] = useState(0);
  const [visit, setVisit] = useState(initial >= 0 ? 1 : 0);

  useEffect(() => { eng.current = createScene(canvas.current, SECTORS); if (initial >= 0) eng.current.jump(initial); }, []);

  const setHash = id => { try { history.replaceState(null, '', id ? '#' + id : location.pathname + location.search); } catch (e) {} };
  const lock = ms => { busy.current = true; setTimeout(() => { busy.current = false; }, RM ? 200 : ms); };
  const go = (next, d) => { setFrom(screen); setDelay(RM ? 0 : d); setScreen(next); };

  const A = {
    enter() { if (busy.current || screen !== 'welcome') return; lock(1700); eng.current.start(); go('menu', 1.35); setTimeout(() => optRefs.current[0] && optRefs.current[0].focus({ preventScroll: true }), RM ? 60 : 1700); },
    open(i) { if (busy.current) return; lock(1400); eng.current.select(i); setFocus(i); setVisit(v => v + 1); setHover(-1); go('section', screen === 'section' ? .9 : 1.1); setHash(SECTORS[i].id); },
    back() { if (busy.current) return; lock(1300); eng.current.back(); go('menu', .95); setHash(''); setHover(-1); setTimeout(() => optRefs.current[focus] && optRefs.current[focus].focus({ preventScroll: true }), RM ? 60 : 1300); },
    exit() { if (busy.current) return; lock(2200); eng.current.hover(-1); eng.current.exit(); setHover(-1); go('welcome', 1.6); setHash(''); },
    hover(i) { setHover(i); eng.current && eng.current.hover(i); },
  };
  const live = useRef(); live.current = { A, screen };

  useEffect(() => {
    const onKey = e => {
      const { A, screen } = live.current;
      if (screen === 'welcome' && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); A.enter(); }
      else if (e.key === 'Escape') { if (screen === 'section') A.back(); else if (screen === 'menu') A.exit(); }
      else if (screen === 'menu' && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) {
        e.preventDefault();
        const list = optRefs.current.filter(Boolean), idx = list.indexOf(document.activeElement);
        const next = list[(idx + (e.key === 'ArrowDown' ? 1 : -1) + list.length) % list.length]; next && next.focus();
      }
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, []);

  const sec = SECTORS[focus], hov = hover >= 0 ? SECTORS[hover] : null;
  const hue = screen === 'section' ? sec.hue : hov ? hov.hue : hover === -2 ? '#FF7A6B' : '#6EA8FF';
  const status = screen === 'welcome' ? 'Standby' : screen === 'section' ? `Sector · ${sec.label}` : hov ? `Routing → ${hov.label}` : hover === -2 ? 'Close session?' : 'Select a sector';
  const hidden = s => ({ inert: s ? '' : undefined, 'aria-hidden': s ? 'true' : undefined });
  const welcomeState = screen === 'welcome' ? 'on' : (from === 'welcome' || screen !== 'welcome') ? 'off' : 'back';
  const menuState = screen === 'menu' ? 'on' : screen === 'welcome' ? 'pre' : 'post';
  const Body = BODIES[sec.id];
  const prev = SECTORS[(focus + SECTORS.length - 1) % SECTORS.length], next = SECTORS[(focus + 1) % SECTORS.length];

  return html`<${Fragment}>
    <canvas id="scene" ref=${canvas} aria-hidden="true" style=${{ position: 'fixed', inset: 0, zIndex: 0 }}></canvas>

    <div className="hud" style=${{ '--cur': hue }} aria-hidden="true">
      <span className="corner tl"></span><span className="corner tr"></span><span className="corner bl"></span><span className="corner br"></span>
      <div className="bar top"><span>SK // Portfolio · 2026</span><span className="status">${status}</span></div>
      <div className="bar bottom">
        <span className="keys">
          ${screen === 'welcome' ? html`<span><kbd>Enter</kbd>Start</span>` : null}
          ${screen === 'menu' ? html`<${Fragment}><span><kbd>↑↓</kbd>Navigate</span><span><kbd>Enter</kbd>Select</span><span><kbd>Esc</kbd>Exit</span><//>` : null}
          ${screen === 'section' ? html`<span><kbd>Esc</kbd>Back to menu</span>` : null}
        </span>
        <span>Bangalore, India</span>
      </div>
    </div>

    <div className="screen welcome" data-state=${welcomeState} style=${{ '--d': delay + 's' }} onClick=${A.enter} ...${hidden(screen !== 'welcome')}>
      <p className="kicker">Java Backend Developer</p>
      <${Title} />
      <p className="tagline"><b>Secure, auditable backend services</b> for banking. Four years of Java, Spring Boot and enterprise integration.</p>
      <button className="start" type="button" onClick=${e => { e.stopPropagation(); A.enter(); }}><span className="blink">▸</span> Start</button>
      <div className="hint">Click anywhere or press Enter</div>
      <div className="loader" aria-hidden="true"><i></i></div>
      <div className="loader-label">Session established · 5 queues online</div>
    </div>

    <div className="screen menu" data-state=${menuState} style=${{ '--d': delay + 's' }} ...${hidden(screen !== 'menu')}>
      <div className="menu-col">
        <p className="menu-head">Siddharth Kannan</p>
        <h2 className="menu-title">Select a sector</h2>
        <ul className="opts" onMouseLeave=${() => A.hover(-1)}>
          ${SECTORS.map((s, i) => html`<li key=${s.id}>
            <button type="button" ref=${el => optRefs.current[i] = el} className=${'opt' + (hover === i ? ' hot' : '')} style=${{ '--hue': s.hue, '--i': i }}
              onMouseEnter=${() => A.hover(i)} onFocus=${() => A.hover(i)} onClick=${() => A.open(i)}>
              <span className="sweep"></span>
              <span className="lbl">${s.label}</span>
              <span className="sub">${s.sub}</span>
            </button>
          </li>`)}
          <li className="sep" aria-hidden="true"></li>
          <li>
            <button type="button" ref=${el => optRefs.current[SECTORS.length] = el} className=${'opt exit' + (hover === -2 ? ' hot' : '')} style=${{ '--hue': '#FF7A6B', '--i': SECTORS.length }}
              onMouseEnter=${() => A.hover(-2)} onFocus=${() => A.hover(-2)} onClick=${A.exit}>
              <span className="sweep"></span>
              <span className="lbl">Exit</span>
              <span className="sub">Back to the title screen</span>
            </button>
          </li>
        </ul>
      </div>
      <aside className=${'readout' + (screen === 'menu' && hov ? '' : ' off')} style=${{ '--hue': hov ? hov.hue : '#6EA8FF' }} aria-live="polite">
        ${hov ? html`<${Fragment}>
          <div className="q">SK.${hov.id.toUpperCase()}.QUEUE</div>
          <div className="big">${hov.big}</div>
          <ul>${hov.stats.map(t => html`<li key=${t}>${t}</li>`)}</ul>
        <//>` : null}
      </aside>
    </div>

    <div className="screen section" data-state=${screen === 'section' ? 'on' : 'off'} style=${{ '--hue': sec.hue, '--d': delay + 's' }} ...${hidden(screen !== 'section')}>
      ${visit > 0 ? html`<${Fragment}>
        <button className="back" type="button" onClick=${A.back} key=${'b' + visit}>
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
          Back to menu
        </button>
        <article className="panel" key=${'p' + visit} aria-labelledby="ptitle">
          <p className="p-eyebrow">SK.${sec.id.toUpperCase()}.QUEUE · ${sec.label}</p>
          <h2 className="p-title" id="ptitle">${TITLES[sec.id]}</h2>
          <${Body} />
          <nav className="p-nav" aria-label="Other sectors">
            <button type="button" style=${{ '--to': prev.hue }} onClick=${() => A.open(SECTORS.indexOf(prev))}>← Previous<b>${prev.label}</b></button>
            <button type="button" style=${{ '--to': next.hue }} onClick=${() => A.open(SECTORS.indexOf(next))}>Next →<b>${next.label}</b></button>
          </nav>
        </article>
      <//>` : null}
    </div>

    <${Cursor} color=${hue} hot=${hover !== -1 && screen === 'menu'} />
  <//>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
</script>

</html>
